name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs the unit tests and prints the JaCoCo coverage table (see the "coverage" task in build.gradle)
      - name: Run Tests With Coverage
        shell: bash
        run: ./gradlew coverage --console=plain | tee test-output.txt

      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Unit tests and code coverage"
            echo '```'
            sed -n '/^Tests:/,/^HTML report/p' test-output.txt | grep -v -e '^> Task' -e '^HTML report' -e '^$' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test And Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          if-no-files-found: ignore
